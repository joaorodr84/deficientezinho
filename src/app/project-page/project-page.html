@if (project) {
  <article>
    <a class="back" routerLink="/">&larr; All projects</a>
    <h1>{{ project.name }}</h1>
    <p class="tagline">{{ project.tagline }}</p>
    <p class="description">{{ project.description }}</p>
    <dl>
      <dt>Stack</dt>
      <dd>{{ project.stack }}</dd>
      <dt>Status</dt>
      <dd>{{ project.status }}</dd>
      <dt>Repository</dt>
      <dd><a [href]="project.repo" target="_blank" rel="noopener">{{ project.repo }}</a></dd>
    </dl>
  </article>
} @else {
  <p>Project not found. <a routerLink="/">Back home</a>.</p>
}
