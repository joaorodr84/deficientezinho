<div class="language-switcher" role="group" aria-label="Language">
  @for (option of options; track option.locale) {
    <button
      type="button"
      [class.active]="active() === option.locale"
      [attr.aria-pressed]="active() === option.locale"
      [attr.aria-label]="option.label"
      [title]="option.label"
      (click)="choose(option.locale)"
    >{{ option.code }}</button>
  }
</div>
